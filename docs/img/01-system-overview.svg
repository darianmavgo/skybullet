<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  </defs>
  <rect width="900" height="560" fill="#f4f8fc"/>
  <text x="450" y="28" text-anchor="middle" font-size="20" font-weight="bold">Fig 1 - Sky Bullet system overview (not to scale)</text>
  <!-- ground -->
  <rect x="0" y="500" width="900" height="60" fill="#c9b99a"/>
  <text x="20" y="530" fill="#444">Ground station / anchor</text>
  <!-- cable -->
  <line x1="150" y1="500" x2="150" y2="150" stroke="#333" stroke-width="3" stroke-dasharray="8 4"/>
  <text x="160" y="400" fill="#333">Cable (tether + power)</text>
  <!-- rotating tube platform -->
  <rect x="60" y="120" width="180" height="30" rx="6" fill="#dde" stroke="#333" stroke-width="2"/>
  <text x="150" y="110" text-anchor="middle" font-weight="bold">Hovering rotating platform</text>
  <!-- rotating tube (horizontal arm) -->
  <rect x="60" y="85" width="420" height="22" fill="#fff" stroke="#333" stroke-width="2"/>
  <g stroke="#333"><line x1="90" y1="85" x2="90" y2="107"/><line x1="130" y1="85" x2="130" y2="107"/><line x1="170" y1="85" x2="170" y2="107"/></g>
  <circle cx="150" cy="96" r="6" fill="#333"/>
  <path d="M120,70 A40,40 0 0 1 180,70" fill="none" stroke="#c33" stroke-width="2" marker-end="url(#a)"/>
  <text x="150" y="60" text-anchor="middle" fill="#c33">spin (rotational energy)</text>
  <text x="320" y="76" fill="#333">Launch tube (vacuum-chambered)</text>
  <!-- glider leaving -->
  <polygon points="480,96 520,88 520,104" fill="#e8a33d" stroke="#333"/>
  <line x1="520" y1="96" x2="560" y2="96" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
  <text x="500" y="130" fill="#333">release at tangent</text>
  <!-- trajectory -->
  <path d="M560,96 C700,100 760,200 780,380" fill="none" stroke="#e8a33d" stroke-width="3" stroke-dasharray="3 5"/>
  <text x="640" y="190" fill="#a66">glide (unpowered)</text>
  <!-- catcher platform -->
  <ellipse cx="790" cy="410" rx="80" ry="22" fill="#dde" stroke="#333" stroke-width="2"/>
  <line x1="790" y1="432" x2="790" y2="500" stroke="#333" stroke-width="3"/>
  <text x="790" y="385" text-anchor="middle" font-weight="bold">Catcher platform</text>
  <text x="790" y="470" text-anchor="middle" fill="#333">(see Fig 4)</text>
  <!-- legend -->
  <rect x="270" y="230" width="270" height="110" fill="#fff" stroke="#999"/>
  <text x="280" y="252" font-weight="bold">Key ideas</text>
  <text x="280" y="274">1. Elevator inside tube = magazine</text>
  <text x="280" y="294">2. Spin supplies launch energy</text>
  <text x="280" y="314">3. Glider carries no fuel / battery</text>
  <text x="280" y="334">4. Release angle picks target bearing</text>
</svg>
