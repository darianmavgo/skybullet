<!doctype html>
<html><head><meta charset="utf-8"><title>Sky Bullet dashboard</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
 body{font-family:system-ui,sans-serif;margin:0;background:#f4f8fc;color:#223}
 header{background:#223;color:#fff;padding:10px 20px;display:flex;justify-content:space-between;align-items:center}
 main{padding:16px 20px;display:grid;gap:20px}
 section{background:#fff;border:1px solid #cdd;border-radius:8px;padding:12px 16px}
 h2{margin:0 0 8px;font-size:16px}
 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
 .grid img{width:100%;border:1px solid #dde;border-radius:4px}
 model-viewer{width:100%;height:320px;background:#e9eef5;border-radius:6px}
 pre{background:#10151c;color:#cfe;padding:10px;border-radius:6px;overflow:auto;font-size:12px;margin:0}
 .tag{font-size:12px;color:#667}
 #live{font-size:12px;opacity:.8}
</style></head><body>
<header><b>Sky Bullet</b><span id="live">connecting…</span></header>
<main>
 <section><h2>Range budget (sim/range_budget.py)</h2><pre id="sim">loading…</pre></section>
 <section><h2>Build log (edit blender/scripts/build_*.py to rebuild)</h2><pre id="builds">no builds yet this session</pre></section>
 <section><h2>3D models (assets/models)</h2><div class="grid" id="models"></div></section>
 <section><h2>Schematics (docs/img)</h2><div class="grid" id="svgs"></div></section>
</main>
<script>
let last = null;
const $ = id => document.getElementById(id);
async function refresh(full){
  const s = await (await fetch('/api/state')).json();
  $('builds').textContent = Object.keys(s.builds).length
    ? Object.entries(s.builds).map(([k,v])=>`[${v.when}] ${k} (${v.secs}s)\n${v.log}`).join('\n\n') : 'no builds yet this session';
  if (!full && s.stamp === last) return;
  const first = last === null; last = s.stamp;
  const t = Date.now();
  $('models').innerHTML = s.glbs.map(g=>`<div><model-viewer src="/${g}?t=${t}" camera-controls auto-rotate shadow-intensity="1"></model-viewer><div class="tag">${g}</div></div>`).join('');
  $('svgs').innerHTML = s.svgs.map(n=>`<div><img src="/docs/img/${n}?t=${t}"><div class="tag">${n}</div></div>`).join('');
  $('sim').textContent = await (await fetch('/api/sim')).text();
  $('live').textContent = (first ? 'loaded ' : 'reloaded ') + new Date().toLocaleTimeString() + ' · watching for changes';
}
refresh(true);
setInterval(()=>refresh(false).catch(()=>$('live').textContent='server offline'), 1000);
</script></body></html>
